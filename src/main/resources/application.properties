spring.application.name=gemini-chat

# Actuator — health + metrics (token counts, latency surface here)
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=never

# LLM Observability — Spring AI records one span per ChatClient call.
# Prompt and completion text are included so you can replay exact inputs in traces.
# Set to false in production if prompts contain PII.
spring.ai.chat.observations.include-prompt=true
spring.ai.chat.observations.include-completion=true
management.tracing.sampling.probability=1.0

# Langfuse OTLP export — to enable, add opentelemetry-exporter-otlp to pom.xml
# then set env var: LANGFUSE_OTLP_ENDPOINT=https://cloud.langfuse.com/api/public/otel/v1/traces
# Do NOT set management.otlp.tracing.endpoint here — an empty string causes startup failure.

# SimpleLoggerAdvisor — logs full prompt+response at DEBUG level.
# Flip to DEBUG when you need to see exactly what Gemini received and returned.
logging.level.org.springframework.ai.chat.client.advisor=INFO

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
gemini.batch.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:batchEmbedContents

# Spring AI — Google GenAI (auto-configures ChatClient and EmbeddingModel)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# Agent loop — cap the ReAct loop at 5 tool-call rounds (weather, attractions,
# budget, hotels, transport = 5 tools max). Spring AI default is 10.
# After 5 rounds the LLM is forced to produce a final answer with what it has.
agent.max-tool-call-rounds=5
# Hard wall-clock timeout in seconds for chat and itinerary endpoints.
# If the full agent loop takes longer than this, the request is cancelled.
agent.timeout-seconds=120


# PostgreSQL — Neon cloud database for persistent chat memory
spring.datasource.url=jdbc:postgresql://${NEON_HOST}/${NEON_DB}?sslmode=require
spring.datasource.hikari.data-source-properties.channelBinding=disable
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool tuning for Neon serverless PostgreSQL.
# Neon free tier closes idle connections after 5 minutes on their side.
# Without these, HikariCP holds dead connections and wastes 5-7 seconds
# reconnecting on the first request after an idle period.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Use our own schema script instead of Spring AI's default (which creates spring_ai_chat_memory)
spring.ai.chat.memory.repository.jdbc.schema=classpath:chat-memory-schema.sql
# Force schema init to run on every startup for real DBs (default is "embedded" which skips PostgreSQL)
spring.sql.init.schema-locations=classpath:chat-memory-schema.sql,classpath:db-agent-schema.sql
spring.sql.init.data-locations=classpath:db-agent-data.sql
spring.sql.init.mode=always

# MCP client — connects to gemini-knowledge-mcp-server (RAG + DB tools)
spring.ai.mcp.client.sse.connections.knowledge-server.url=${KNOWLEDGE_MCP_URL:http://localhost:8082}
# Increase MCP tool call timeout — ingestDocument calls Gemini embedding API + Pinecone,
# which together can take 15-30s. Default 10s is too short.
spring.ai.mcp.client.request-timeout=60s

# MCP protocol debug logging — shows outgoing tool call requests to the MCP server
logging.level.io.modelcontextprotocol=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG

# OpenWeatherMap — travel agent weather tool
openweather.api.key=${OPENWEATHER_API_KEY}
openweather.api.url=https://api.openweathermap.org/data/2.5/weather

# Pinecone — plain HTTP (existing RAG endpoints, keep untouched)
pinecone.api.key=${PINECONE_API_KEY}
pinecone.host=${PINECONE_HOST}

# Spring AI Pinecone VectorStore (new Spring AI RAG endpoints)
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=gemini-chat
spring.ai.vectorstore.pinecone.namespace=spring-ai
