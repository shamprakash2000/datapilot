spring.application.name=gemini-chat

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
gemini.batch.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:batchEmbedContents

# Spring AI — Google GenAI (auto-configures ChatClient and EmbeddingModel)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# PostgreSQL — Neon cloud database for persistent chat memory
spring.datasource.url=jdbc:postgresql://${NEON_HOST}/${NEON_DB}?sslmode=require
spring.datasource.hikari.data-source-properties.channelBinding=disable
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Use our own schema script instead of Spring AI's default (which creates spring_ai_chat_memory)
spring.ai.chat.memory.repository.jdbc.schema=classpath:chat-memory-schema.sql
# Force schema init to run on every startup for real DBs (default is "embedded" which skips PostgreSQL)
spring.sql.init.schema-locations=classpath:chat-memory-schema.sql
spring.sql.init.mode=always

# Pinecone
pinecone.api.key=${PINECONE_API_KEY}
pinecone.host=${PINECONE_HOST}
